name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Wybierz źródło projektu
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
            echo "Budowa z normalnych źródeł w repozytorium."
          elif [ -f "ap.zip.b64" ]; then
            echo "Tryb zgodności: odtwarzam projekt z ap.zip.b64."
            rm -rf "$RUNNER_TEMP/przewijak-stage3"
            mkdir -p "$RUNNER_TEMP/przewijak-stage3"

            python - <<'PY'
          import base64
          from pathlib import Path

          src = Path("ap.zip.b64")
          dst = Path("/tmp/przewijak-stage3.zip")
          dst.write_bytes(base64.b64decode(src.read_text().strip()))
          print("ap.zip:", dst.stat().st_size, "bytes")
          PY

            unzip -tq /tmp/przewijak-stage3.zip
            unzip -q /tmp/przewijak-stage3.zip -d "$RUNNER_TEMP/przewijak-stage3"

            SETTINGS_FILE="$(find "$RUNNER_TEMP/przewijak-stage3" -name settings.gradle.kts -print -quit)"
            if [ -z "$SETTINGS_FILE" ]; then
              echo "BLAD: Nie znaleziono settings.gradle.kts"
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          else
            echo "BLAD: Brak normalnych źródeł i brak ap.zip.b64"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projekt: $PROJECT_DIR"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Python 3.10 dla Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Przygotuj Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "BLAD: Nie znaleziono sdkmanager"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Diagnostyka
        shell: bash
        run: |
          set -euo pipefail
          java -version
          python3.10 --version
          gradle --version
          echo "PROJECT_DIR=$PROJECT_DIR"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/SELFTEST_PHONE_STAGE3.py"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

      - name: Self-test
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3.10 SELFTEST_PHONE_STAGE3.py

      - name: Zbuduj APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Sprawdz APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "BLAD: APK nie zostalo utworzone"
            find "$PROJECT_DIR/app/build" -type f 2>/dev/null || true
            exit 1
          fi

          ls -lh "$APK"

      - name: Przygotuj APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cloud-output
          cp \
            "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
            cloud-output/Przewijak_PHONE_STAGE3.apk
          sha256sum \
            cloud-output/Przewijak_PHONE_STAGE3.apk \
            > cloud-output/Przewijak_PHONE_STAGE3.apk.sha256.txt

      - name: Udostepnij APK
        uses: actions/upload-artifact@v4
        with:
          name: Przewijak-PHONE-Stage3-APK
          path: cloud-output/
          if-no-files-found: error
          retention-days: 14
