name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Odtworz ap.zip
        shell: bash
        run: |
          python - <<'PY'
          import base64, pathlib
          src = pathlib.Path("ap.zip.b64")
          dst = pathlib.Path("ap.zip")
          dst.write_bytes(base64.b64decode(src.read_text().strip()))
          print("ap.zip:", dst.stat().st_size, "bytes")
          PY
          test -s ap.zip
          unzip -tq ap.zip

      - name: Rozpakuj ap.zip
        shell: bash
        run: |
          rm -rf unpacked
          mkdir -p unpacked
          unzip -q ap.zip -d unpacked

          SETTINGS_FILE="$(find unpacked -name settings.gradle.kts -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "BLAD: Nie znaleziono settings.gradle.kts w ap.zip"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projekt znaleziony: $PROJECT_DIR"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Python 3.10 dla Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Sprawdz Python 3.10
        shell: bash
        run: |
          python --version
          python3 --version
          python3.10 --version
          which python
          which python3.10

      - name: Przygotuj Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "BLAD: Nie znaleziono sdkmanager"
            exit 1
          fi

          echo "sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER"             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Diagnostyka
        shell: bash
        run: |
          java -version
          python3.10 --version
          gradle --version
          echo "PROJECT_DIR=$PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Self-test
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f "SELFTEST_PHONE_STAGE3.py" ]; then
            echo "BLAD: Brak SELFTEST_PHONE_STAGE3.py"
            exit 1
          fi

          python3.10 SELFTEST_PHONE_STAGE3.py

      - name: Zbuduj APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "Python dla Chaquopy:"
          python3.10 --version
          which python3.10

          gradle             --no-daemon             --stacktrace             :app:assembleDebug

      - name: Sprawdz APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "BLAD: APK nie zostalo utworzone"
            find "$PROJECT_DIR/app/build" -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK GOTOWE:"
          ls -lh "$APK"

      - name: Przygotuj APK
        shell: bash
        run: |
          mkdir -p cloud-output

          cp             "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"             cloud-output/Przewijak_PHONE_STAGE3.apk

          sha256sum             cloud-output/Przewijak_PHONE_STAGE3.apk             > cloud-output/Przewijak_PHONE_STAGE3.apk.sha256.txt

          ls -lh cloud-output/

      - name: Udostepnij APK
        uses: actions/upload-artifact@v4
        with:
          name: Przewijak-PHONE-Stage3-APK
          path: cloud-output/
          if-no-files-found: error
          retention-days: 14
